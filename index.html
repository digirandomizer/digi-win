
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NEXA | Click & Win</title>

<style>
* {
  box-sizing: border-box;
}

body {
  font-family: Arial, sans-serif;
  background: #f4f5f7;
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 100vh;
  margin: 0;
  padding: 20px;
}

.card {
  background: white;
  padding: 40px 25px;
  border-radius: 16px;
  text-align: center;
  width: 100%;
  max-width: 420px;
  box-shadow: 0 8px 30px #00000015;
}

.nexa-logo {
  width: 220px;
  max-width: 85%;
  height: auto;
}

.tagline {
  font-size: 14px;
  letter-spacing: 2px;
  color: #555;
  margin-top: 12px;
}

.campaign {
  font-size: 12px;
  letter-spacing: 3px;
  color: #777;
  margin-top: 30px;
}

h1 {
  font-size: 30px;
  color: #222;
}

p {
  color: #555;
  line-height: 1.6;
}

.emoji {
  font-size: 64px;
  margin-top: 20px;
}

.cta {
  display: block;
  background: #222;
  color: white;
  text-decoration: none;
  padding: 16px 20px;
  border-radius: 8px;
  font-size: 15px;
  font-weight: bold;
  margin-top: 30px;
  transition: background 0.2s;
}

.cta:hover {
  background: #555;
}

.footer {
  margin-top: 30px;
  font-size: 12px;
  color: #888;
}

.digi-logo {
  color: #e60012;
  font-size: 28px;
  font-weight: bold;
  font-style: italic;
}
</style>
</head>

<body>

<div class="card">

  <img src="nexa-logo.png"
       class="nexa-logo"
       alt="NEXA">

  <div class="tagline">
    Retail. Connected.
  </div>

  <div class="campaign">
    CLICK & WIN
  </div>

  <div id="result"></div>

  <a href="https://www.digisystem.com/"
     class="cta"
     target="_blank"
     rel="noopener noreferrer">
    Discover More About DIGI &rarr;
  </a>

  <div class="footer">
    Powered by
    <div class="digi-logo">DIGI</div>
  </div>

</div>

<script>
const result = Math.random() < 0.05 ? "win" : "lose";

document.getElementById("result").innerHTML =
  result === "win"
  ? `<div class="emoji">🎉</div>
     <h1>Congratulations!</h1>
     <p>You have won an exclusive DIGI souvenir!</p>
     <p>Show this screen to our booth representative
     to claim your prize.</p>`
  : `<div class="emoji">😊</div>
     <h1>Thank You!</h1>
     <p>Thank you for participating!</p>
     <p>Discover how NEXA is transforming
     the retail experience.</p>`;
</script>

</body>
</html>
