
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DIGI | Click & Win</title>
<style>
body {
  font-family: Arial, sans-serif;
  background: #f5f5f5;
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 100vh;
  margin: 0;
}
.card {
  background: white;
  padding: 40px 25px;
  border-radius: 16px;
  text-align: center;
  width: 85%;
  max-width: 400px;
  box-shadow: 0 8px 30px #00000015;
}
.logo {
  color: #e60012;
  font-size: 48px;
  font-weight: bold;
  font-style: italic;
}
h1 { font-size: 28px; }
p { color: #555; line-height: 1.6; }
.emoji { font-size: 64px; }
</style>
</head>
<body>

<div class="card">
  <div class="logo">DIGI</div>
  <p>CLICK & WIN</p>
  <div id="result"></div>
</div>

<script>
let result = localStorage.getItem("digiWinResult");


const result = Math.random() < 0.05 ? "win" : "lose";


document.getElementById("result").innerHTML =
  result === "win"
  ? `<div class="emoji">🎉</div>
     <h1>Congratulations!</h1>
     <p>You have won an exclusive DIGI souvenir!</p>
     <p>Show this screen to our booth representative
     to claim your prize.</p>`
  : `<div class="emoji">😊</div>
     <h1>Thank You!</h1>
     <p>Thank you for participating and visiting DIGI.
     Enjoy the rest of your experience!</p>`;
</script>

</body>
</html>
